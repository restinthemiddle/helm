on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  release:
    # On pull requests, semantic-release runs as a dry-run so pipeline breakage shows up before merge.
    # Fork PRs get no write token, so they are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: 'false'

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install helm-docs
        run: |
          cd /tmp
          wget https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar -xzf helm-docs_1.14.2_Linux_x86_64.tar.gz
          sudo mv helm-docs /usr/local/bin/

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v8.1.3
        env:
          GITHUB_TOKEN: ${{ github.event_name == 'pull_request' && github.token || secrets.SEMANTIC_RELEASE_TOKEN }}
        with:
          dry_run: ${{ github.event_name == 'pull_request' }}
          unset_gha_env: ${{ github.event_name == 'pull_request' }}
          branches: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          extra_plugins: |
            @semantic-release/git
            @semantic-release/exec
            @semantic-release/changelog
            conventional-changelog-conventionalcommits@8

      - name: Run chart-releaser
        if: github.event_name != 'pull_request'
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
